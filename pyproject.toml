[project]
name = "vmr-task"
version = "0.1.0"
description = "Visuomotor rotation task with explicit aiming reports"
authors = [
    {name = "Liang Lee",email = "52850586+liangleeTW@users.noreply.github.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame-ce (>=2.5,<3.0)",
    "pyyaml (>=6.0,<7.0)",
    "numpy (>=1.26,<2.0)",
    "pandas (>=2.2,<3.0)"
]

[tool.poetry]
packages = [{include = "vmr"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
marimo = "^0.9"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
